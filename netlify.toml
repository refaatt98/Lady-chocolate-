# ===== إعدادات Netlify =====
# Netlify بيقرأ هالملف لحاله لما تربط الريبو من GitHub.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# --- تحويلات ---

# الرابط القديم/المختصر للطلبية
[[redirects]]
  from = "/order"
  to = "/cart"
  status = 301

[[redirects]]
  from = "/products"
  to = "/shop"
  status = 301

[[redirects]]
  from = "/products/:slug"
  to = "/product/:slug"
  status = 301

# React Router: تحويل المسارات إلى index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- التخزين المؤقت ---

# ملفات assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# الصور
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# تحديث index.html باستمرار
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- هيدرز الأمان والسماح بالتضمين ---

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()
